name: Build release zip

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check tag matches manifest version
        run: |
          manifest_version=$(jq -r .version manifest.json)
          if [ "${GITHUB_REF_NAME}" != "v${manifest_version}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match manifest.json version ${manifest_version}"
            exit 1
          fi

      - name: Build zip
        run: zip -r "chilis-filter-${GITHUB_REF_NAME}.zip" manifest.json *.js *.css options.html icons

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" "chilis-filter-${GITHUB_REF_NAME}.zip" --generate-notes
