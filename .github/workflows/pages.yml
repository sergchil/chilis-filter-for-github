name: Deploy site

on:
  push:
    branches: [master]
    paths: ["site/**", "shared.js", "icons/**", "docs/screenshots/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # The demo runs the extension's own shared.js, so the page always matches the shipped defaults.
      - name: Assemble site
        run: |
          mkdir -p _site
          cp -R site/. _site/
          cp shared.js _site/
          cp -R icons _site/icons
          cp -R docs/screenshots _site/screenshots

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
